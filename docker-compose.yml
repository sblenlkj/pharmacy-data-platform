services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pharmacy_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro

volumes:
  pharmacy_postgres_data:
